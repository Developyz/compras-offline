name: compras_offline
description: Base Android de Canasta, con funcionamiento offline-first previsto.
publish_to: none
version: 0.4.2+6

environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'

# Dominio, vistas y adaptador SQLite. Cámara y red siguen pendientes.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: 1.3.0
  intl: 0.20.3
  drift: 2.35.3
  sqlite3: 3.9.1
  path_provider: 2.1.6
  path: 1.9.1
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/esquema_v4.json
    - assets/db/unidades_iniciales.json
