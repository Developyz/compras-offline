name: compras_offline
description: Base Android de Canasta, con funcionamiento offline-first previsto.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'

# Solo la base visual. Cámara, datos y red se incorporarán por etapas.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: 1.3.0
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
